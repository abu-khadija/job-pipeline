# Job sources. Endpoints were checked on Oct 2, 2026; details in docs/SOURCES-VERIFIED.md.

userAgent: "job-pipeline (personal job search; contact: islamabukhadiga@gmail.com)"
timeoutMs: 20000
retries: 2

sources:
  himalayas:
    enabled: true
    # Search endpoint, filtered to jobs open to candidates in Egypt. 20 jobs per page (fixed by Himalayas).
    url: "https://himalayas.app/jobs/api/search"
    country: EG
    # country=EG guarantees Egypt-eligible, so cast a wide net here. More queries = more real jobs.
    queries: [qa engineer, quality assurance, test automation, automation engineer, sdet, software tester, qa analyst, qa automation, test engineer, quality engineer, automation tester, test analyst, qa specialist, playwright, cypress, selenium, manual tester, mobile qa, arabic qa, localization qa]
    maxPagesPerQuery: 8
  remoteok:
    enabled: true
    # Returns the latest ~100 jobs. First element is a legal notice; link back to Remote OK.
    url: "https://remoteok.com/api"
  remotive:
    enabled: true
    # Remotive asks for max 4 calls per day. 2 calls per run x 2 runs = 4.
    url: "https://remotive.com/api/remote-jobs"
    requests:
      - { category: qa }
      - { search: test automation }
  builtin:
    enabled: true
    # Remote QA jobs that list Egypt as an allowed country (each job page states it in its data).
    # robots.txt: listing/category pages and job pages are allowed; ?search= and ?page= are not.
    listPages:
      - "https://builtin.com/jobs/remote/dev-engineering/qa?country=EGY"
      - "https://builtin.com/jobs/remote/dev-engineering/qa/senior?country=EGY"
      - "https://builtin.com/jobs/remote/dev-engineering/qa/project-mgmt?country=EGY"
      - "https://builtin.com/jobs/emea/remote/dev-engineering/qa"
      - "https://builtin.com/jobs/mena/remote/dev-engineering/qa"
      # Not added: /qa/mid-level (robots.txt disallows "/jobs/*mid-level"); hybrid (remote only).
    maxJobsPerRun: 40
    delayMs: 1500          # one page every 1.5 s: be gentle
  weworkremotely:
    enabled: true
    # The main feed shows ~10 jobs per category, so category feeds are added. No QA category exists.
    feeds:
      - "https://weworkremotely.com/remote-jobs.rss"
      - "https://weworkremotely.com/categories/remote-programming-jobs.rss"
      - "https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss"
      - "https://weworkremotely.com/categories/all-other-remote-jobs.rss"
      - "https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss"

  # Phase 1b, not built yet
  jobicy: { enabled: false }
  arbeitnow: { enabled: false, url: "https://www.arbeitnow.com/api/job-board-api" }
  workingnomads: { enabled: false }
  hackernews: { enabled: false }

# Company ATS boards, polled every 3 hours (npm run fetch -- --only=ats).
# Job-alert emails Islam already receives become pipeline input (ToS-safe way to use LinkedIn/Wuzzuf,
# which can't be scraped). Haiku reads each email; each company is then looked up on its own careers site.
emailLeads:
  enabled: true
  lookbackDays: 2
  maxEmailsPerRun: 25
  senders:
    - jobalerts-noreply@linkedin.com
    - jobs-listings@linkedin.com
    - alerts@ziprecruiter.com
    - noreply@glassdoor.com
    - updates@getjobcopilot.com
    - mail.remotehunter.com
    - marketing.remotehunter.com
    - hi@himalayas.app
    - wuzzuf.net
    - bayt.com

# The watchlist grows by itself: any company with an Egypt-eligible job is looked up on
# Greenhouse, Lever and Ashby. Public read-only APIs; a 404 means "no board".
ats:
  enabled: true
  greenhouse: "https://boards-api.greenhouse.io/v1/boards/{slug}/jobs?content=true"
  lever: "https://api.lever.co/v0/postings/{slug}?mode=json"
  ashby: "https://api.ashbyhq.com/posting-api/job-board/{slug}?includeCompensation=true"
  smartrecruiters: "https://api.smartrecruiters.com/v1/companies/{slug}/postings?limit=100"
  workable: "https://apply.workable.com/api/v1/widget/accounts/{slug}?details=true"
  maxNewCompanyLookupsPerRun: 15
  # Companies to always watch: { ats: greenhouse|lever|ashby, slug: "...", company: "..." }
  # Target companies: remote-first / EOR-friendly / MENA-friendly, with a confirmed public board.
  # Polled every 3h for QA roles; each is still checked for Egypt eligibility before it counts.
  # Verified live Oct 4 2026. Islam can set a Watchlist row's `active` to no to stop one.
  seeds:
    - { ats: greenhouse, slug: canonical, company: Canonical (Ubuntu) }       # hires "Home based - EMEA" (Egypt ok)
    - { ats: greenhouse, slug: elastic, company: Elastic }                     # remote-first, global
    - { ats: greenhouse, slug: grafanalabs, company: Grafana Labs }           # remote-first, global
    - { ats: greenhouse, slug: mongodb, company: MongoDB }
    - { ats: greenhouse, slug: twilio, company: Twilio }
    - { ats: greenhouse, slug: docker, company: Docker }                       # all-remote
    - { ats: greenhouse, slug: postman, company: Postman }
    - { ats: greenhouse, slug: webflow, company: Webflow }
    - { ats: greenhouse, slug: contentful, company: Contentful }
    - { ats: greenhouse, slug: typeform, company: Typeform }
    - { ats: greenhouse, slug: doximity, company: Doximity }                   # health-tech (his domain)
    - { ats: greenhouse, slug: instabug, company: Instabug }                   # Egyptian-founded
    - { ats: lever, slug: toptal, company: Toptal }
    - { ats: ashby, slug: deel, company: Deel }                                # the EOR company itself
    - { ats: ashby, slug: supabase, company: Supabase }                        # all-remote
    - { ats: ashby, slug: posthog, company: PostHog }                          # all-remote
    - { ats: ashby, slug: commure, company: Commure }                         # health-tech
    # Valsoft's market (Vertical Market Software acquirers) — pollable boards:
    - { ats: lever, slug: pointclickcare, company: PointClickCare (health VMS, Canada) }
    - { ats: greenhouse, slug: mitratech, company: Mitratech (legal VMS) }
    - { ats: greenhouse, slug: banyansoftware, company: Banyan Software (acquirer) }
    - { ats: ashby, slug: everfield, company: Everfield (EU VMS acquirer) }
    - { ats: greenhouse, slug: diligent, company: Diligent }
    - { ats: ashby, slug: lightspeed, company: Lightspeed (Canada) }
    # Storyteller's market (sports-tech, content/video SDKs, fan engagement) — hire remote globally:
    - { ats: smartrecruiters, slug: sportradar, company: Sportradar (sports data) }
    - { ats: greenhouse, slug: geniussports, company: Genius Sports }
    - { ats: lever, slug: fireworkhq, company: Firework (shoppable video) }
    - { ats: greenhouse, slug: bitmovin, company: Bitmovin (video infra) }
